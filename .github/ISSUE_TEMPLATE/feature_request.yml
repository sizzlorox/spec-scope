name: Feature request
description: Suggest a capability spec-scope doesn't have.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        spec-scope tries to stay small: read specs, draw them, discuss them, export them.
        The most persuasive requests describe a review that was genuinely harder than it
        needed to be, not a feature in the abstract.

        Check the [Roadmap](https://github.com/sizzlorox/spec-scope#roadmap) first — it may
        already be planned, in which case add your use case to the existing thread instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched [existing issues](https://github.com/sizzlorox/spec-scope/issues?q=is%3Aissue) and the README roadmap.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What were you actually trying to do, and where did spec-scope get in the way?
        Describe the situation, not the feature.
      placeholder: >
        When reviewing an OpenSpec change I can see the new requirements, but I can't tell
        at a glance which existing requirements it modifies, so I end up diffing by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: Your proposed behaviour. Sketch the CLI flags, UI, or diagram output if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part would this touch
      description: Best guess is fine.
      multiple: true
      options:
        - Detection (new project layout)
        - Parsing (new syntax or dialect)
        - Diagram generation (new diagram kind)
        - Review server / browser UI
        - Notes and the agent loop
        - Tech doc export
        - CLI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example input and output
      description: >
        If this involves new spec syntax or a new diagram, show the Markdown going in and
        what should come out. Rendered as Markdown.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: >
        Other tools, a workaround you're using today, or a different design you rejected
        and why.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to implement this?
      description: Not a commitment, and "no" is a fine answer.
      options:
        - Yes, I'd like to open a PR
        - Yes, with guidance on where to start
        - "No, just suggesting"
    validations:
      required: true
